  </g>
  <g inkscape:groupmode="layer" inkscape:label="floor-2" transform="translate(5,5)" style="display:none">
    <path inkscape:label="outline" d="M 0,0 H 80 V 40 H 0 Z" stroke="#000" fill="none"/>
    <path inkscape:label="walk" d="M 0,20 H 80" stroke="#00f" fill="none"/>
    <rect inkscape:label="room-201" x="50" y="24" width="20" height="16" fill="#fcc"/>
    <circle inkscape:label="door-201" cx="60" cy="24" r="1"/>
    <circle inkscape:label="stairs-a" cx="10" cy="20" r="1"/>
    <circle inkscape:label="elevator-1" cx="74" cy="20" r="1"/>
  </g>
